                                        <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyy AI Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">

<style>
body{
  margin:0;
  background:#0d0b1f;
  font-family:Poppins,Arial,sans-serif;
  color:#fff;
}
.app-header{
  text-align:center;
  padding:40px 20px 10px;
}
.heading{
  font-size:30px;
  font-weight:700;
  background:linear-gradient(90deg,#c77dff,#ff72e1);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.sub-heading{
  color:#ccc;
  margin-top:-5px;
}
.suggestions{
  list-style:none;
  padding:0 20px;
}
.suggestions-item{
  background:#131228;
  padding:18px;
  border-radius:18px;
  margin:12px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}
.suggestions-item:hover{background:#1b1934}
.icon{
  background:#1f1b3a;
  padding:10px;
  border-radius:50%;
  font-size:22px;
  color:#d46bff;
}
.chats-container{
  padding:20px;
  margin-bottom:140px;
  max-height:calc(100vh - 260px);
  overflow-y:auto;
}
.message{
  padding:12px 15px;
  border-radius:15px;
  margin-bottom:12px;
  max-width:85%;
  font-size:14px;
}
.user-message{
  background:#2c2c4a;
  margin-left:auto;
}
.bot-message{
  background:#1b1b35;
  margin-right:auto;
}
.prompt-container{
  position:fixed;
  bottom:0;
  width:100%;
  background:#0d0b1f;
  padding:12px 18px 20px;
}
.prompt-wrapper{
  display:flex;
  gap:10px;
  align-items:center;
}
.prompt-input{
  flex:1;
  padding:14px 16px;
  border-radius:20px;
  border:none;
  outline:none;
  background:#1c1a33;
  color:white;
}
button{
  background:#1c1a33;
  border:none;
  padding:12px;
  border-radius:50%;
  color:white;
  font-size:22px;
  cursor:pointer;
}
button:hover{background:#262347}
#file-input{display:none}
</style>
</head>

<body>

<header class="app-header">
  <h1 class="heading">Halo, selamat datang di Lyy | AI</h1>
  <p class="sub-heading">Ada yang bisa aku bantu? 🫶</p>
</header>

<ul class="suggestions">
  <li class="suggestions-item"><span>Kapan Lyy Hultah?</span><span class="icon material-symbols-rounded">calendar_month</span></li>
  <li class="suggestions-item"><span>Rekomendasi film terbaru</span><span class="icon material-symbols-rounded">movie</span></li>
  <li class="suggestions-item"><span>Tips belajar efektif</span><span class="icon material-symbols-rounded">school</span></li>
</ul>

<div class="chats-container" id="chatBox"></div>

<div class="prompt-container">
  <div class="prompt-wrapper">
    <input id="input" class="prompt-input" placeholder="Tanyakan sesuatu ke Lyy..." />
    <input type="file" id="file-input">
    <button id="fileBtn" class="material-symbols-rounded">attach_file</button>
    <button id="sendBtn" class="material-symbols-rounded">arrow_upward</button>
  </div>
</div>

<script>
const API_KEY = "PASTE_API_KEY_KAMU_DI_SINI";

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("input");

let history = [{
  role:"user",
  parts:[{text:"Kamu adalah AI milik Lyy. Jawaban lembut, ramah, dan cute."}]
];

function addMessage(text,isUser){
  const div=document.createElement("div");
  div.className="message "+(isUser?"user-message":"bot-message");
  div.innerHTML=text;
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
}

async function send(){
  const text=input.value.trim();
  if(!text) return;

  addMessage(text,true);
  input.value="";

  if(text.toLowerCase().includes("hultah")){
    addMessage("Hultah Lyy tanggal <b>03 Desember</b> 🎂✨",false);
    return;
  }

  addMessage("Mengetik...",false);
  const loading=chatBox.lastChild;

  history.push({role:"user",parts:[{text}]});

  const res=await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${API_KEY}`,
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:history})
    }
  );

  const data=await res.json();
  loading.remove();

  const reply=data.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, Lyy error 🥺";
  addMessage(reply,false);

  history.push({role:"model",parts:[{text:reply}]});
}

document.getElementById("sendBtn").onclick=send;
input.onkeydown=e=>{if(e.key==="Enter")send();}

document.querySelectorAll(".suggestions-item").forEach(i=>{
  i.onclick=()=>{
    input.value=i.innerText;
    send();
  }
});

document.getElementById("fileBtn").onclick=()=>document.getElementById("file-input").click();
</script>

</body>
</html>
